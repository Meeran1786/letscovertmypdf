/* ══════════════════════════════════════
   THEME CONTEXT
══════════════════════════════════════ */
const ThemeCtx = createContext({ isDark: true, toggle: () => {} });

function ThemeProvider({ children }) {
  const [isDark, setIsDark] = useState(() => {
    const saved = localStorage.getItem('lcpdf-theme');
    return saved ? saved === 'dark' : true;
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    localStorage.setItem('lcpdf-theme', isDark ? 'dark' : 'light');
  }, [isDark]);

  const toggle = () => setIsDark(d => !d);
  return <ThemeCtx.Provider value={{ isDark, toggle }}>{children}</ThemeCtx.Provider>;
}
const useTheme = () => useContext(ThemeCtx);

/* ══════════════════════════════════════
   AUTH CONTEXT
══════════════════════════════════════ */
const AuthCtx = createContext({ user: null, token: null, login: () => {}, logout: () => {}, openAuth: () => {} });

function AuthProvider({ children }) {
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('lcpdf-user')); } catch { return null; }
  });
  const [token, setToken] = useState(() => localStorage.getItem('lcpdf-token') || null);
  const [authOpen, setAuthOpen] = useState(false);
  const [authMode, setAuthMode] = useState('login'); // login | signup | reset
  const [authIntro, setAuthIntro] = useState('');

  const login = (tok, usr) => {
    if (!tok) { setAuthOpen(false); return; }
    setToken(tok); setUser(usr);
    localStorage.setItem('lcpdf-token', tok);
    localStorage.setItem('lcpdf-user', JSON.stringify(usr));
    setAuthOpen(false);
  };

  const logout = async () => {
    try { await fetch('/api/auth/logout', { method:'POST', headers:{ Authorization:`Bearer ${token}` } }); } catch {}
    setToken(null); setUser(null);
    localStorage.removeItem('lcpdf-token');
    localStorage.removeItem('lcpdf-user');
  };

  const openAuth = (mode = 'login', intro = '') => { setAuthMode(mode); setAuthIntro(intro); setAuthOpen(true); };

  useEffect(() => {
    if (!authOpen) return;
    const onKey = e => { if (e.key === 'Escape') setAuthOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [authOpen]);

  // Validate saved token on load
  useEffect(() => {
    if (token && !user) {
      fetch('/api/auth/me', { headers:{ Authorization:`Bearer ${token}` } })
        .then(r => r.json()).then(d => { if (d.user) setUser(d.user); else { setToken(null); localStorage.removeItem('lcpdf-token'); } }).catch(() => {});
    }
  }, []);

  return (
    <AuthCtx.Provider value={{ user, token, login, logout, openAuth, isAuthenticated: !!user }}>
      {children}
      {authOpen && <AuthModal mode={authMode} intro={authIntro} onMode={setAuthMode} onClose={() => setAuthOpen(false)}/>}
    </AuthCtx.Provider>
  );
}
const useAuth = () => useContext(AuthCtx);

/* ══════════════════════════════════════

══════════════════════════════════════ */
function authHeaders(token, extra) {
  return token ? { ...extra, Authorization: `Bearer ${token}` } : { ...extra };
}

      {d.split('M').filter(Boolean).map((seg,i) => <path key={i} d={'M'+seg}/>)}
    </svg>
  );
}

/* ══════════════════════════════════════
   GOOGLE SIGN-IN
   Google Identity Services must be initialised once per page; re-initialising
   on every render (as before) dropped the credential callback. The modal
   swaps in its handler through gisCallback.
══════════════════════════════════════ */
const gisCallback = { current: null };
let gisInitialisedFor = null;
function waitForGis(timeoutMs = 8000) {
  return new Promise(resolve => {
    const start = Date.now();
    (function check() {
      if (window.google?.accounts?.id) return resolve(window.google.accounts.id);
      if (Date.now() - start > timeoutMs) return resolve(null);
      setTimeout(check, 150);
    })();
  });
}

function AuthModal({ mode, intro, onMode, onClose }) {
  const { login } = useAuth();
  const [step, setStep] = useState('form'); // form | otp
  const [pendingEmail, setPendingEmail] = useState('');
  const [pendingName, setPendingName] = useState('');
  const [otpPurpose, setOtpPurpose] = useState('login');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [showPw, setShowPw] = useState(false);
  const [deliveryWarning, setDeliveryWarning] = useState('');
  const [googleConfig, setGoogleConfig] = useState(null); // null = loading, else { googleSignInEnabled, googleClientId }
  const [googleBlocked, setGoogleBlocked] = useState(false);
  const [notice, setNotice] = useState('');
  const googleBtnRef = useRef(null);

  // form state
  const [f, setF] = useState({ name:'', email:'', password:'', confirmPw:'', resetEmail:'', newPw:'', confirmNewPw:'' });
  const set = k => e => setF(p => ({ ...p, [k]: e.target.value }));

  const post = async (url, body) => {
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    return d;
  };

  const handleLogin = async e => {
    e.preventDefault(); setError(''); setLoading(true);
    try {
      const d = await post('/api/auth/login', { email: f.email, password: f.password });
      setDeliveryWarning(d.emailSent === false ? d.message : '');
      setPendingEmail(d.email); setOtpPurpose('login'); setStep('otp');
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  const handleSignup = async e => {
    e.preventDefault(); setError('');
    if (f.password !== f.confirmPw) return setError('Passwords do not match.');
    setLoading(true);
    try {
      const d = await post('/api/auth/register', { name: f.name, email: f.email, password: f.password });
      setDeliveryWarning(d.emailSent === false ? d.message : '');
      setPendingEmail(d.email); setPendingName(f.name); setOtpPurpose('register'); setStep('otp');
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  const handleForgot = async e => {
    e.preventDefault(); setError(''); setLoading(true);
    try {
      const d = await post('/api/auth/forgot-password', { email: f.resetEmail });
      setPendingEmail(d.email); setOtpPurpose('reset'); setStep('otp');
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  // Fetch whether Google Sign-In is configured server-side (Client ID is public,
  // safe to hand to the browser — no secret involved in this flow).
  useEffect(() => {
    fetch('/api/config').then(r => r.json()).then(setGoogleConfig).catch(() => setGoogleConfig({ googleSignInEnabled: false }));
  }, []);

  gisCallback.current = async (response) => {
    setError(''); setLoading(true);
    try {
      const d = await post('/api/auth/google', { idToken: response.credential });
      login(d.token, d.user); // Google already verified the email — skip OTP entirely.
    } catch (e) { setError(e.message); }
    setLoading(false);
  };

  // Once we know Google Sign-In is enabled and the GIS script has loaded, render
  // Google's real button into our container (a custom-styled button isn't allowed
  // by Google's branding terms for this flow). Re-runs when the form re-mounts
  // (tab switch, coming back from the code step) so the button never vanishes.
  useEffect(() => {
    if (!googleConfig?.googleSignInEnabled || mode === 'reset' || step !== 'form') return;
    let cancelled = false;
    waitForGis().then(gis => {
      if (cancelled || !googleBtnRef.current) return;
      if (!gis) { setGoogleBlocked(true); return; }
      if (gisInitialisedFor !== googleConfig.googleClientId) {
        gis.initialize({ client_id: googleConfig.googleClientId, callback: r => gisCallback.current?.(r), ux_mode: 'popup' });
        gisInitialisedFor = googleConfig.googleClientId;
      }
      const width = Math.max(200, Math.min(400, googleBtnRef.current.offsetWidth || 320));
      googleBtnRef.current.innerHTML = '';
      gis.renderButton(googleBtnRef.current, { theme: 'outline', size: 'large', shape: 'pill', width, text: 'continue_with', logo_alignment: 'center' });
    });
    return () => { cancelled = true; };
  }, [googleConfig, mode, step]);

  const handleResetDone = () => {
    setStep('form'); onMode('login'); setError('');
    setNotice('Your password has been reset. Log in with your new password.');
  };

  return (
    <div className="anim-fade overlay" role="dialog" aria-modal="true">
      <div className="card-solid anim-up w-full max-w-md relative p-6 sm:p-8">
        <button onClick={onClose} className="absolute top-4 right-4 p-1.5 rounded-lg hover:bg-red-500/10 text-red-400 transition-colors" aria-label="Close">
          <Ic n="close" sz={16}/>
        </button>

        <div className="flex items-center gap-2.5 mb-6">
          <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white text-sm">L</div>
          <span className="font-bold" style={{color:'var(--text)'}}>LetsConvertPDF</span>
        </div>

        {intro && step === 'form' && (
          <div className="mb-5 text-sm rounded-xl p-3 flex items-start gap-2" style={{background:'rgba(37,99,235,0.08)',border:'1px solid rgba(37,99,235,0.25)',color:'var(--text)'}}>
            <Ic n="sparkle" sz={15} cls="text-blue-400 shrink-0 mt-0.5"/>
            <span>{intro}</span>
          </div>
        )}

        {step === 'otp' ? (
          <OTPStep email={pendingEmail} purpose={otpPurpose} newPw={otpPurpose==='reset' ? f.newPw : null}
            warning={deliveryWarning} onBack={() => setStep('form')}
            onSuccess={otpPurpose === 'reset' ? handleResetDone : login}/>
        ) : (
          <>
            {/* Tabs */}
            {mode !== 'reset' && (
              <div className="flex mb-6" style={{background:'var(--bg-input)', borderRadius:'0.75rem', padding:'4px'}}>
                {['login','signup'].map(m => (
                  <button key={m} onClick={() => { onMode(m); setError(''); }}
                    className="flex-1 py-2 text-sm font-semibold rounded-[0.5rem] transition-all"
                    style={{ background: mode===m ? '#2563EB' : 'transparent', color: mode===m ? '#fff' : 'var(--muted)' }}>
                    {m === 'login' ? 'Log In' : 'Sign Up'}
                  </button>
                ))}
              </div>
            )}

            {mode === 'reset' && (
              <div className="mb-6">
                <h2 className="text-xl font-bold" style={{color:'var(--text)'}}>Reset Password</h2>
                <p className="text-sm mt-1" style={{color:'var(--muted)'}}>Enter your email to receive a reset code.</p>
              </div>
            )}

            {error && <div className="mb-4 text-sm rounded-xl p-3" style={{background:'rgba(239,68,68,0.1)',color:'#F87171',border:'1px solid rgba(239,68,68,0.3)'}}>{error}</div>}
            {notice && !error && <div className="mb-4 text-sm rounded-xl p-3" style={{background:'rgba(16,185,129,0.1)',color:'#34D399',border:'1px solid rgba(16,185,129,0.3)'}}>{notice}</div>}

            {/* Google button — real Google Identity Services button when configured,
                a disabled explainer button otherwise. */}
            {mode !== 'reset' && googleConfig?.googleSignInEnabled && !googleBlocked && (
              <div className="mb-4 flex justify-center" style={{minHeight:44}}>
                <div ref={googleBtnRef} className="w-full flex justify-center"/>
              </div>
            )}
            {mode !== 'reset' && googleBlocked && (
              <p className="mb-4 text-xs text-center rounded-xl p-3" style={{background:'var(--bg-input)',color:'var(--muted)'}}>
                Google sign-in couldn't load. An ad or tracker blocker may be blocking accounts.google.com — allow it for this site, or use email below.
              </p>
            )}
            {mode !== 'reset' && googleConfig && !googleConfig.googleSignInEnabled && (
              <button type="button" disabled title="Google Sign-In isn't set up on this server yet"
                className="w-full flex items-center justify-center gap-2.5 py-2.5 mb-4 rounded-xl font-medium text-sm opacity-50 cursor-not-allowed"
                style={{background:'var(--bg-input)',border:'1px solid var(--border-s)',color:'var(--text)'}}>
                <Ic n="google" sz={18}/> Continue with Google (not set up yet)
              </button>
            )}
            {mode !== 'reset' && (
              <div className="flex items-center gap-3 mb-4">
                <div className="flex-1 h-px" style={{background:'var(--border)'}}/>
                <span className="text-xs" style={{color:'var(--subtle)'}}>or</span>
                <div className="flex-1 h-px" style={{background:'var(--border)'}}/>
              </div>
            )}

            {/* Login form */}
            {mode === 'login' && (
              <form onSubmit={handleLogin} className="space-y-3">
                <input className="inp" type="email" placeholder="Email address" value={f.email} onChange={set('email')} required/>
                <div className="relative">
                  <input className="inp pr-10" type={showPw?'text':'password'} placeholder="Password" value={f.password} onChange={set('password')} required/>
                  <button type="button" onClick={() => setShowPw(s=>!s)} className="absolute right-3 top-1/2 -translate-y-1/2" style={{color:'var(--muted)'}} aria-label={showPw ? 'Hide password' : 'Show password'}>
                    <Ic n={showPw?'eyeOff':'eye'} sz={16}/>
                  </button>
                </div>
                <button type="button" onClick={() => { onMode('reset'); setError(''); }}
                  className="text-xs text-blue-400 hover:text-blue-300 transition-colors">Forgot password?</button>
                <button type="submit" disabled={loading}
                  className="w-full py-3 rounded-xl font-bold text-white text-sm transition-colors mt-2"
                  style={{background: loading ? '#1D4ED8' : '#2563EB'}}>
                  {loading ? 'Sending code…' : 'Continue'}
                </button>
              </form>
            )}

            {/* Signup form */}
            {mode === 'signup' && (
              <form onSubmit={handleSignup} className="space-y-3">
                <input className="inp" type="text" placeholder="Full name" value={f.name} onChange={set('name')} required/>
                <input className="inp" type="email" placeholder="Email address" value={f.email} onChange={set('email')} required/>
                <div className="relative">
                  <input className="inp pr-10" type={showPw?'text':'password'} placeholder="Password (min. 8 chars)" value={f.password} onChange={set('password')} required/>
                  <button type="button" onClick={() => setShowPw(s=>!s)} className="absolute right-3 top-1/2 -translate-y-1/2" style={{color:'var(--muted)'}} aria-label={showPw ? 'Hide password' : 'Show password'}>
                    <Ic n={showPw?'eyeOff':'eye'} sz={16}/>

                </div>
                <input className="inp" type="password" placeholder="Confirm password" value={f.confirmPw} onChange={set('confirmPw')} required/>
                <button type="submit" disabled={loading}

              </p>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ─── OTP Step ─── */
function OTPStep({ email, purpose, newPw, warning, onBack, onSuccess }) {
  const [digits, setDigits] = useState(['','','','','','']);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [resent, setResent] = useState(false);
  const [deliveryWarning, setDeliveryWarning] = useState(warning || '');
  const [step2, setStep2] = useState(purpose === 'reset' ? 'otp' : 'otp'); // otp | newpw
  const [newPwState, setNewPwState] = useState('');
  const [confirmPw, setConfirmPw] = useState('');
  const refs = Array.from({length:6}, () => useRef());

  const code = digits.join('');

  const handleDigit = (i, val) => {
    const v = val.replace(/\D/g,'').slice(-1);
    const next = [...digits]; next[i] = v; setDigits(next);
    if (v && i < 5) refs[i+1].current?.focus();
  };
  const handleKey = (i, e) => {
    if (e.key === 'Backspace' && !digits[i] && i > 0) refs[i-1].current?.focus();
  };
  const handlePaste = e => {
    const pasted = e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6).split('');
    setDigits([...pasted, ...Array(6).fill('')].slice(0,6));
    refs[Math.min(pasted.length, 5)].current?.focus();
    e.preventDefault();
  };

  const verify = async () => {
    setError(''); setLoading(true);
    try {
      if (purpose === 'reset' && step2 === 'newpw') {
        if (newPwState !== confirmPw) { setError('Passwords do not match.'); setLoading(false); return; }
        const r = await fetch('/api/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, code, newPassword: newPwState }) });
        const d = await r.json(); if (!r.ok) throw new Error(d.error);
        // After reset, just close and prompt login
        onSuccess(null, null); // signal done without token
        return;
      }
      const r = await fetch('/api/auth/verify-otp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, code }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      if (purpose === 'reset') { setStep2('newpw'); } else { onSuccess(d.token, d.user); }
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  const resend = async () => {
    try {
      const r = await fetch('/api/auth/resend-otp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, purpose }) });
      const d = await r.json().catch(() => ({}));
      setDeliveryWarning(d.emailSent === false ? (d.message || "We couldn't deliver that email just now.") : '');
    } catch { setDeliveryWarning("We couldn't reach the server to resend that code. Check your connection and try again."); }
    setResent(true); setTimeout(() => setResent(false), 30000);
  };

  if (step2 === 'newpw') return (
    <div className="anim-up">
      <h2 className="text-xl font-bold mb-1" style={{color:'var(--text)'}}>Set New Password</h2>
      <p className="text-sm mb-4" style={{color:'var(--muted)'}}>OTP verified. Enter your new password.</p>

/* ══════════════════════════════════════
   PDF UTILITIES
══════════════════════════════════════ */
const pxToMm = px => (px * 25.4) / 96;
const fmtSize = b => b > 1048576 ? `${(b/1048576).toFixed(2)} MB` : `${(b/1024).toFixed(1)} KB`;

async function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader(); r.onerror = reject; r.onload = e => resolve(e.target.result); r.readAsArrayBuffer(file);
  });
}
function loadImageToCanvas(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image(); img.onerror = reject;
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
        const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0);
        resolve({ dataUrl: c.toDataURL('image/jpeg',0.92), w:img.naturalWidth, h:img.naturalHeight });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function renderPdfPage(pdfBytes, pageNum, scale=1.5) {
  const arr = pdfBytes instanceof Uint8Array ? pdfBytes : new Uint8Array(pdfBytes);
  const pdf = await pdfjsLib.getDocument({ data:arr }).promise;
  const page = await pdf.getPage(Math.min(pageNum, pdf.numPages));
  const vp = page.getViewport({ scale });
  const canvas = document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height;
  await page.render({ canvasContext:canvas.getContext('2d'), viewport:vp }).promise;
  return { dataUrl: canvas.toDataURL(), numPages: pdf.numPages };
}
async function callServerAPI(endpoint, file, toolId, token, fields = {}) {
  const fd = new FormData(); fd.append('toolId', toolId);
  Object.entries(fields).forEach(([k, v]) => v != null && fd.append(k, v));
  fd.append('file', file);
  const r = await fetch(`/api/${endpoint}`, { method:'POST', headers: authHeaders(token), body:fd });
  if (!r.ok) {
    const e = await r.json().catch(()=>({}));
    const err = new Error(e.error || `Server error ${r.status}`);
    err.status = r.status; err.usage = e.usage;
    throw err;
  }
  const blob = await r.blob();
  const filename = (r.headers.get('Content-Disposition')||'').match(/filename="?([^"]+)"?/)?.[1] || `output.pdf`;
  return { blob, filename };
}

/* PDF processing functions */
async function processMerge(files) {
  const { PDFDocument } = PDFLib; const out = await PDFDocument.create();
  for (const f of files) { const d = await PDFDocument.load(await readFileAsArrayBuffer(f),{ignoreEncryption:true}); const p = await out.copyPages(d,d.getPageIndices()); p.forEach(pg=>out.addPage(pg)); }
  return await out.save();
}
async function processSplit(file) {
  const { PDFDocument } = PDFLib; const src = await PDFDocument.load(await readFileAsArrayBuffer(file),{ignoreEncryption:true});
  return Promise.all(Array.from({length:src.getPageCount()},async(_,i)=>{const d=await PDFDocument.create();const[p]=await d.copyPages(src,[i]);d.addPage(p);return{bytes:await d.save(),name:`page_${i+1}.pdf`};}));
}
async function processRotate(file,deg) { const {PDFDocument,degrees}=PDFLib; const d=await PDFDocument.load(await readFileAsArrayBuffer(file),{ignoreEncryption:true}); d.getPages().forEach(p=>{const c=p.getRotation().angle;p.setRotation(degrees((c+deg)%360));}); return d.save(); }
async function processOrganize(file,order) { const {PDFDocument}=PDFLib; const src=await PDFDocument.load(await readFileAsArrayBuffer(file),{ignoreEncryption:true}); const out=await PDFDocument.create(); const idx=order.filter(i=>i>=0&&i<src.getPageCount()); const pages=await out.copyPages(src,idx); pages.forEach(p=>out.addPage(p)); return out.save(); }
async function processWatermark(file,text,opacity,fontSize,color) {
  const {PDFDocument,rgb,degrees}=PDFLib; const d=await PDFDocument.load(await readFileAsArrayBuffer(file),{ignoreEncryption:true}); const font=await d.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const h=color||'#3B82F6'; const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
  const size=fontSize||48; const tw=font.widthOfTextAtSize(text,size); const k=Math.SQRT1_2;
  // Rotate 45° around the page centre: offset the start point along the rotated baseline.
  d.getPages().forEach(pg=>{const{width,height}=pg.getSize();pg.drawText(text,{x:width/2-(tw/2)*k+(size/3)*k,y:height/2-(tw/2)*k-(size/3)*k,size,font,color:rgb(r,g,b),opacity:opacity||0.25,rotate:degrees(45)});});
  return d.save();
}
async function processCrop(file,m) {
  const {PDFDocument}=PDFLib; const d=await PDFDocument.load(await readFileAsArrayBuffer(file));
  d.getPages().forEach(pg=>{
    const b=pg.getCropBox(); const mm=Math.max(0,Math.min(m,b.width/2-10,b.height/2-10));
    pg.setCropBox(b.x+mm,b.y+mm,b.width-mm*2,b.height-mm*2); pg.setMediaBox(b.x+mm,b.y+mm,b.width-mm*2,b.height-mm*2);
  });
  return d.save();
}
async function processImageToPDF(files) {
  const imgs=await Promise.all(files.map(loadImageToCanvas)); const{jsPDF}=window.jspdf; const f=imgs[0];
  const pdf=new jsPDF({orientation:f.w>=f.h?'landscape':'portrait',unit:'mm',format:[pxToMm(f.w),pxToMm(f.h)]});
  imgs.forEach(({dataUrl,w,h},i)=>{const wm=pxToMm(w),hm=pxToMm(h);if(i>0)pdf.addPage([wm,hm],w>=h?'landscape':'portrait');pdf.addImage(dataUrl,'JPEG',0,0,wm,hm,undefined,'MEDIUM');});
  return new Uint8Array(await pdf.output('blob').arrayBuffer());
}

  const handle = files => { if (disabled) return; onFiles(tool.multi || tool.batch ? files : [files[0]]); };
  return (
    <div onDragOver={e=>{e.preventDefault();if(!disabled)setDrag(true)}} onDragLeave={()=>setDrag(false)}

      className={`drop-zone rounded-2xl border-2 border-dashed p-12 text-center transition-all ${drag?'drop-active':''} ${disabled?'opacity-50 cursor-not-allowed':'cursor-pointer'}`}

        </svg>
      </div>
      <p className="font-semibold text-lg mb-2" style={{color:'var(--text)'}}>{disabled ? 'Daily limit reached' : tool.id==='compare' ? 'Drop the old and new versions here' : `Drop ${tool.multi||tool.batch?'files':'file'} here`}</p>
      <p className="text-sm mb-6" style={{color:'var(--muted)'}}>{disabled ? 'Come back tomorrow, or sign up for more free uses' : `or click to browse · ${tool.accept.toUpperCase().replace(/\./g,'').replace(/,/g,', ')}`}</p>

        <button className="px-8 py-2.5 rounded-xl font-semibold text-sm text-white flex items-center gap-2 mx-auto" style={{background:'#2563EB'}}>
          <Ic n="upload" sz={15}/> Select File{tool.multi||tool.batch?'s':''}

      {!disabled && tool.batch && <p className="text-xs mt-3" style={{color:'var(--subtle)'}}>Tip: select several files to process them all at once.</p>}
    </div>
  );
}

/* The canvas stays transparent and the ink is dark, so the stamped signature
   looks like a real one on the white page (previously it was a dark box). A
   white backdrop sits behind the canvas only on screen. */
function SignaturePad({ onSign }) {
  const ref = useRef(); const drawing = useRef(false); const dirty = useRef(false);
  const ctxOf = () => { const ctx=ref.current.getContext('2d'); ctx.strokeStyle='#0F172A'; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round'; return ctx; };
  const pos=(e,c)=>{const r=c.getBoundingClientRect();const t=e.touches?.[0]||e;return[(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height];};
  const start=e=>{drawing.current=true;const c=ref.current;const ctx=ctxOf();const[x,y]=pos(e,c);ctx.beginPath();ctx.moveTo(x,y);};
  const move=e=>{if(!drawing.current)return;e.preventDefault();const c=ref.current;const ctx=ctxOf();const[x,y]=pos(e,c);ctx.lineTo(x,y);ctx.stroke();dirty.current=true;};
  const stop=()=>{if(!drawing.current)return;drawing.current=false;if(dirty.current&&onSign)onSign(ref.current.toDataURL('image/png'));};
  const clear=()=>{const c=ref.current;c.getContext('2d').clearRect(0,0,c.width,c.height);dirty.current=false;onSign&&onSign(null);};
  return (
    <div>
      <canvas ref={ref} width={680} height={260} className="rounded-xl w-full cursor-crosshair touch-none" style={{border:'1px solid var(--border-s)',background:'#FFFFFF',aspectRatio:'680/260'}}
        onMouseDown={start} onMouseMove={move} onMouseUp={stop} onMouseLeave={stop}
        onTouchStart={start} onTouchMove={move} onTouchEnd={stop}/>
      <button onClick={clear} className="mt-2 text-xs flex items-center gap-1 hover:text-red-400 transition-colors" style={{color:'var(--muted)'}}>
        <Ic n="trash" sz={11}/> Clear
      </button>
    </div>
  );
}

  if (tool.id==='protect') return <div className="space-y-3">{inp('password','Password','password','Enter strong password',{autoComplete:'new-password'})}{inp('confirmPw','Confirm Password','password','Re-enter password',{autoComplete:'new-password'})}<p className="text-xs" style={{color:'var(--muted)'}}>Encrypted with AES-256 on your device. Anyone opening the PDF will need this password, and we never see it.</p></div>;
  if (tool.id==='unlock') return <div className="space-y-3">{inp('password','Current password','password','Password used to open this PDF',{autoComplete:'off'})}<p className="text-xs" style={{color:'var(--muted)'}}>Only unlock files you own or are allowed to edit. Leave empty if the PDF only has editing/printing restrictions.</p></div>;
  if (tool.id==='compress') return (
    <div>
      <label className="block text-xs font-medium mb-2" style={{color:'var(--muted)'}}>Compression level</label>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
        {[['low','Light','Best quality'],['recommended','Recommended','Good quality, smaller'],['extreme','Strong','Smallest file']].map(([v,l,d])=>{
          const on=(config.level||'recommended')===v;
          return <button key={v} onClick={()=>set(c=>({...c,level:v}))} className="p-3 rounded-xl text-left transition-all"
            style={{background:on?'rgba(37,99,235,0.15)':'var(--bg-input)',border:`1px solid ${on?'#2563EB':'var(--border-s)'}`}}>
            <p className="text-sm font-semibold" style={{color:'var(--text)'}}>{l}</p><p className="text-xs" style={{color:'var(--muted)'}}>{d}</p></button>;
        })}
      </div>
    </div>
  );
  if (tool.id==='crop') return inp('margin','Margin to crop (pt)','number','20');
  if (tool.id==='organize') return <div className="space-y-3"><p className="text-xs" style={{color:'var(--muted)'}}>Enter comma-separated page numbers in desired order (1-based).</p>{inp('order','Page Order','text','e.g. 3,1,2,4')}</div>;
  if (tool.id==='sign') return file ? <SignStudio file={file} config={config} set={set}/> : null;
  if (tool.id==='ocr') return <p className="text-sm" style={{color:'var(--muted)'}}>We'll recognise the text on every page and add an invisible text layer, so you can search, select and copy it. Your pages look exactly the same. English text is supported today.</p>;
  if (tool.id==='repair') return <p className="text-sm" style={{color:'var(--muted)'}}>We'll rebuild the file's structure on your device. If it is badly damaged, we recreate each page from what can still be read.</p>;
  if (tool.id==='edit') return file ? <EditorStudio file={file} config={config} set={set}/> : null;
  if (tool.id==='pagenumbers') return <PageNumbersPanel config={config} set={set}/>;
  if (tool.id==='redact') return file ? <RedactPanel file={file} config={config} set={set}/> : null;
  if (tool.id==='fillform') return file ? <FormFiller file={file} config={config} set={set}/> : null;
  if (tool.id==='workflow') return <WorkflowBuilder config={config} set={set}/>;
  if (tool.id==='flatten') return <p className="text-sm" style={{color:'var(--muted)'}}>Form answers and fields become part of the page, so they print correctly and can't be edited.</p>;
  if (tool.id==='pdfa') return <p className="text-sm" style={{color:'var(--muted)'}}>Converts to PDF/A-2b: fonts are embedded and colours fixed so the file opens the same way decades from now. This needs our server; your file is deleted within 60 seconds.</p>;
  return <p className="text-sm" style={{color:'var(--muted)'}}>Click the button below to process your file.</p>;
}

/* ══════════════════════════════════════
   WORKSPACE
══════════════════════════════════════ */
function Workspace({ tool, onBack }) {
  const { isAuthenticated, token, openAuth } = useAuth();
  const [state, setState] = useState('drop');
  const [files, setFiles] = useState([]);
  const [config, setConfig] = useState({ degrees:90, text:'CONFIDENTIAL', fontSize:48, opacity:0.25, color:'#3B82F6' });
  const [progress, setProgress] = useState(0);
  const [error, setError] = useState('');
  const [pdfBytes, setPdfBytes] = useState(null);
  const [dlItems, setDlItems] = useState([]);
  const [dlName, setDlName] = useState('');
  const [preview, setPreview] = useState(false);
  const [status, setStatus] = useState('Processing…');
  const [usageStatus, setUsageStatus] = useState(null);
  const [showUpgrade, setShowUpgrade] = useState(false);
  const [resultNote, setResultNote] = useState('');
  const col = C[tool.color]||C.blue;

  const refreshUsage = useCallback(() => {
    fetchUsageStatus(tool.id, token).then(setUsageStatus).catch(() => setUsageStatus(null));
  }, [tool.id, token]);

  useEffect(() => { refreshUsage(); }, [refreshUsage]);

  const accepts = f => tool.accept.split(',').some(a => a.endsWith('/*') ? f.type.startsWith(a.slice(0,-1)) : f.name.toLowerCase().endsWith(a.trim()));
  const handleFiles = picked => {
    const ok = picked.filter(Boolean).filter(accepts);
    if (!ok.length) { setError(`Please choose a ${tool.accept.toUpperCase().replace(/\./g,'').replace(/,/g,' / ')} file.`); return; }
    setFiles(ok); setState('config');
    setError(ok.length < picked.length ? 'Some files were skipped because they are not the right type.' : '');
  };
  const removeFile  = i => setFiles(f=>{const n=f.filter((_,idx)=>idx!==i); if(!n.length) setState('drop'); return n;});
  const moveFile    = (i,dir) => setFiles(f=>{const n=[...f];const j=i+dir;if(j<0||j>=n.length)return f;[n[i],n[j]]=[n[j],n[i]];return n;});
  const fmtSz = b => b>1048576?`${(b/1048576).toFixed(2)} MB`:`${(b/1024).toFixed(1)} KB`;

  const download = () => {
    if (!pdfBytes) return;
    const url = URL.createObjectURL(new Blob([pdfBytes],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=dlName;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  };
  const downloadAll = async () => {
    const zip=new JSZip();
    for(const item of dlItems){const r=await fetch(item.url);zip.file(item.name,await r.blob());}
    const a=document.createElement('a');a.href=URL.createObjectURL(await zip.generateAsync({type:'blob'}));a.download=`${tool.id}_output.zip`;a.click();
  };

  const process = async () => {
    setState('processing'); setProgress(0); setError(''); setResultNote('');
    const tick=v=>setProgress(v);
    try {
      tick(10);
      if (tool.engine==='server') {
        const ep={word2pdf:'convert/to-pdf',excel2pdf:'convert/to-pdf',ppt2pdf:'convert/to-pdf',html2pdf:'convert/to-pdf',pdf2word:'convert/pdf-to-docx',pdf2excel:'convert/pdf-to-xlsx',pdf2ppt:'convert/pdf-to-pptx',pdfa:'convert/pdf-to-pdfa'}[tool.id];
        setStatus('Uploading securely and converting…'); tick(30);
        const{blob,filename}=await callServerAPI(ep,files[0],tool.id,token);
        tick(85);
        if(filename.endsWith('.pdf')){const b=new Uint8Array(await blob.arrayBuffer());setPdfBytes(b);setDlName(filename);setDlItems([{url:'#pdf',name:filename,size:fmtSz(b.byteLength)}]);}
        else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setDlItems([{url,name:filename,size:fmtSz(blob.size)}]);}
      } else {
        // Client-side tools still spend from the same daily quota — consume before processing locally.
        if (tool.id==='sign' && !config.sigData) throw new Error('Add your signature first.');
        if (tool.id==='protect' && config.password!==config.confirmPw) throw new Error('Passwords do not match.');
        if (tool.id==='merge' && files.length<2) throw new Error('Add at least two PDFs to merge.');
        setStatus('Checking your free-use quota…'); tick(15);
        await consumeUsage(tool.id, token);
        setStatus('Processing on your device…');tick(20);
        const batch = tool.batch && files.length > 1;
        let result;
        if (batch) {
          // Same tool, same settings, every file. Bates numbers carry on across files.
          const items=[]; let cfg={...config};
          for (let i=0;i<files.length;i++) {
            setStatus(`File ${i+1} of ${files.length}: ${files[i].name}`); tick(20+Math.round(75*i/files.length));
            const r=await runTool(tool.id,[files[i]],cfg,{});
            items.push({bytes:r.bytes,name:r.name});
            if (tool.id==='pagenumbers'&&cfg.bates) cfg={...cfg,start:(parseInt(cfg.start)||1)+(await PDFLib.PDFDocument.load(r.bytes)).getPageCount()};
          }
          result={items,note:`Processed ${files.length} files on your device.`};
        } else result = await runTool(tool.id, files, config, { tick, setStatus });
        setResultNote(result.note||'');
        if (result.items) setDlItems(toItems(result.items));
        else { setPdfBytes(result.bytes); setDlName(result.name); setDlItems([{url:'#pdf',name:result.name,size:fmtSz(result.bytes.byteLength)}]); }
      }
      tick(100); setState('done'); refreshUsage();
    } catch(e) {
      console.error(e);
      if (e.status === 429) { setShowUpgrade(true); setState('config'); refreshUsage(); return; }
      setError(e.message||'Processing failed'); setState('config');
    }
  };

  const quotaExhausted = usageStatus && usageStatus.limit !== null && usageStatus.remaining <= 0;

  return (
    <div className="min-h-screen pt-24 pb-16 px-4">
      <div className="max-w-2xl mx-auto">
        <button onClick={onBack} className="flex items-center gap-2 text-sm mb-8 group transition-colors" style={{color:'var(--muted)'}}>
          <Ic n="left" sz={13} cls="group-hover:-translate-x-0.5 transition-transform"/>All Tools
        </button>
        <div className="flex items-center gap-4 mb-6">
          <div className="w-13 h-13 rounded-2xl flex items-center justify-center" style={{background:col.bg,border:`1px solid ${col.bd}`,width:'3.25rem',height:'3.25rem'}}>
            <svg width={26} height={26} viewBox="0 0 24 24" fill="none" stroke={col.ic} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              {(ICONS[tool.icon]||ICONS.file).split('M').filter(Boolean).map((s,i)=><path key={i} d={'M'+s}/>)}
            </svg>
          </div>
          <div>
            <h1 className="text-2xl font-bold" style={{color:'var(--text)'}}>{tool.label}</h1>
            <p className="text-sm" style={{color:'var(--muted)'}}>{tool.desc}</p>
          </div>
        </div>

        <div className="mb-4"><PrivacyBadge tool={tool}/></div>
        <UsageBadge status={usageStatus} isAuthenticated={isAuthenticated} onUpgrade={() => openAuth('signup', `Sign up to get 3 free ${tool.label} uses every day — no credit card required.`)}/>
        {!isAuthenticated && !quotaExhausted && <GuestBanner tool={tool}/>}

        {/* Drop */}
        {state==='drop' && error && <div className="rounded-xl p-3 mb-4 text-sm" style={{background:'rgba(239,68,68,0.1)',color:'#F87171',border:'1px solid rgba(239,68,68,0.3)'}}>{error}</div>}
        {state==='drop' && <DropZone tool={tool} onFiles={handleFiles} disabled={quotaExhausted}/>}

        {/* AI tools: chat / summarise */}
        {state==='config' && tool.ai && (
          <div className="space-y-4">
            <div className="flex items-center gap-3 card p-3">
              <Ic n="file" sz={16} cls="text-blue-400 shrink-0"/>
              <p className="text-sm font-medium truncate flex-1" style={{color:'var(--text)'}}>{files[0]?.name}</p>
              <button onClick={()=>{setState('drop');setFiles([]);setError('');}} className="text-xs text-blue-400 hover:text-blue-300">Change file</button>
            </div>
            {error && <div className="rounded-xl p-3 text-sm" style={{background:'rgba(239,68,68,0.1)',color:'#F87171',border:'1px solid rgba(239,68,68,0.3)'}}>{error}</div>}
            <AiWorkspace key={files[0]?.name+files[0]?.size} tool={tool} file={files[0]}
              onQuota={async()=>{try{await consumeUsage(tool.id,token);refreshUsage();}catch(e){if(e.status===429){setShowUpgrade(true);setState('drop');setFiles([]);refreshUsage();}throw e;}}}
              onError={e=>{if(e&&e.status===429)return;console.error(e);setError(e.message||'Something went wrong.');}}/>
          </div>
        )}

        {/* Compare: needs exactly two files, shows results in place */}
        {state==='config' && tool.custom==='compare' && (files.length<2
          ? <div className="space-y-3"><div className="card p-4 text-sm" style={{color:'var(--text)'}}>Got <strong>{files[0]?.name}</strong>. Now add the other version.</div><DropZone tool={{...tool,multi:false}} onFiles={f=>setFiles(prev=>[...prev,...f].slice(0,2))}/></div>
          : <div className="space-y-4">
              <div className="card p-3 text-sm flex flex-wrap items-center gap-2" style={{color:'var(--text)'}}><span className="text-red-400">Old:</span> {files[0].name} <span className="text-emerald-400 ml-2">New:</span> {files[1].name}
                <button onClick={()=>setFiles(f=>[f[1],f[0]])} className="text-xs text-blue-400 ml-auto">Swap</button>
                <button onClick={()=>{setState('drop');setFiles([]);setError('');}} className="text-xs text-blue-400">Start over</button></div>
              {error && <div className="rounded-xl p-3 text-sm" style={{background:'rgba(239,68,68,0.1)',color:'#F87171',border:'1px solid rgba(239,68,68,0.3)'}}>{error}</div>}
              <CompareWorkspace key={files.map(f=>f.name+f.size).join('|')} files={files}
                onQuota={async()=>{try{await consumeUsage(tool.id,token);refreshUsage();}catch(e){if(e.status===429){setShowUpgrade(true);setState('drop');setFiles([]);refreshUsage();}throw e;}}}
                onError={e=>{if(e&&e.status===429)return;setError(e.message||'Something went wrong.');}}/>
            </div>)}

        {/* Config */}
        {state==='config' && !tool.ai && !tool.custom && (
          <div className="space-y-5 anim-up">
            {/* Files */}
            <div className="card p-4 space-y-2">
              {files.map((f,i)=>(
                <div key={i} className="flex items-center gap-3 rounded-xl p-2" style={{background:'var(--bg-input)'}}>
                  <Ic n="file" sz={16} cls="text-blue-400 shrink-0"/>
                  <div className="flex-1 min-w-0"><p className="text-sm font-medium truncate" style={{color:'var(--text)'}}>{f.name}</p><p className="text-xs" style={{color:'var(--muted)'}}>{fmtSz(f.size)}</p></div>
                  {(tool.multi||tool.batch) && files.length>1 && <>
                    <button onClick={()=>moveFile(i,-1)} disabled={i===0} className="p-1 rounded-lg disabled:opacity-30 hover:text-blue-400" style={{color:'var(--muted)'}} aria-label={`Move ${f.name} up`}><Ic n="left" sz={13} cls="rotate-90"/></button>
                    <button onClick={()=>moveFile(i,1)} disabled={i===files.length-1} className="p-1 rounded-lg disabled:opacity-30 hover:text-blue-400" style={{color:'var(--muted)'}} aria-label={`Move ${f.name} down`}><Ic n="right" sz={13} cls="rotate-90"/></button>
                  </>}
                  <button onClick={()=>removeFile(i)} className="p-1 rounded-lg hover:bg-red-500/10 text-red-400/60 hover:text-red-400 transition-colors" aria-label={`Remove ${f.name}`}><Ic n="trash" sz={13}/></button>
                </div>
              ))}
              {(tool.multi||tool.batch) && <label className="flex items-center gap-2 text-xs text-blue-400 hover:text-blue-300 cursor-pointer mt-1"><input type="file" className="hidden" accept={tool.accept} multiple onChange={e=>{const added=Array.from(e.target.files);e.target.value='';setFiles(f=>[...f,...added]);}}/><Ic n="upload" sz={12}/> Add more</label>}
            </div>
            {error && <div className="rounded-xl p-3 text-sm" style={{background:'rgba(239,68,68,0.1)',color:'#F87171',border:'1px solid rgba(239,68,68,0.3)'}}>{error}</div>}
            <div className="card p-5 space-y-4">
              <h3 className="font-semibold text-sm" style={{color:'var(--text)'}}>Options</h3>
              <ConfigPanel tool={tool} config={config} set={setConfig} file={files[0]}/>
            </div>
            <button onClick={process} disabled={files.length===0 || quotaExhausted}
              className="w-full py-4 rounded-2xl font-bold text-white flex items-center justify-center gap-2 transition-colors disabled:opacity-50"
              style={{background:'#2563EB'}}>
              <svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                {(ICONS[tool.icon]||ICONS.file).split('M').filter(Boolean).map((s,i)=><path key={i} d={'M'+s}/>)}
              </svg>
              {tool.label}
            </button>
          </div>
        )}

        {/* Processing */}
        {state==='processing' && (
          <div className="card p-10 text-center space-y-6 anim-fade">
            <div className="relative w-20 h-20 mx-auto">
              <div className="absolute inset-0 rounded-full border-2 border-blue-600/20"/>
              <div className="absolute inset-0 rounded-full border-2 border-blue-500 border-t-transparent animate-spin"/>
              <div className="absolute inset-3 rounded-full flex items-center justify-center" style={{background:col.bg}}>
                <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke={col.ic} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  {(ICONS[tool.icon]||ICONS.file).split('M').filter(Boolean).map((s,i)=><path key={i} d={'M'+s}/>)}
                </svg>
              </div>
            </div>
            <div><p className="font-semibold" style={{color:'var(--text)'}}>{status}</p><p className="text-sm mt-1" style={{color:'var(--muted)'}}>{files.map(f=>f.name).join(', ')}</p></div>
            <div className="w-full rounded-full h-2 overflow-hidden" style={{background:'var(--bg-input)'}}>
              <div className="progress-bar h-full rounded-full transition-all" style={{width:`${progress}%`}}/>
            </div>
            <p className="text-sm font-medium text-blue-400">{progress}%</p>
          </div>
        )}

        {/* Done */}
        {state==='done' && (
          <div className="space-y-4 anim-up">
            <div className="card p-5" style={{borderColor:'rgba(16,185,129,0.3)'}}>
              <div className="flex items-center gap-3 mb-4">
                <div className="w-9 h-9 rounded-full bg-emerald-500/20 flex items-center justify-center">
                  <Ic n="check" sz={18} cls="text-emerald-400"/>
                </div>
                <div><p className="font-semibold" style={{color:'var(--text)'}}>Processing Complete!</p><p className="text-xs" style={{color:'var(--muted)'}}>{resultNote||'Your file is ready to download.'}</p></div>
              </div>

              {/* PDF single output */}
              {pdfBytes && dlItems.length===1 && dlItems[0].url==='#pdf' && (
                <div className="space-y-3">
                  <div className="flex items-center gap-3 rounded-xl p-3" style={{background:'var(--bg-input)'}}>
                    <Ic n="file" sz={15} cls="text-blue-400 shrink-0"/>
                    <div className="flex-1 min-w-0"><p className="text-sm font-medium truncate" style={{color:'var(--text)'}}>{dlName}</p><p className="text-xs" style={{color:'var(--muted)'}}>{fmtSz(pdfBytes.byteLength)}</p></div>
                  </div>
                  <div className="flex gap-3">
                    <button onClick={()=>setPreview(true)} className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl font-semibold text-sm transition-colors text-blue-400"
                      style={{border:'1px solid rgba(37,99,235,0.4)',background:'rgba(37,99,235,0.05)'}}>
                      <Ic n="preview" sz={14}/> Preview
                    </button>
                    <button onClick={download} className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl font-bold text-sm text-white" style={{background:'#2563EB'}}>
                      <Ic n="download" sz={14}/> Download PDF
                    </button>
                  </div>
                </div>
              )}

              {/* Multi-file output */}
              {(dlItems.length>1||(dlItems.length===1&&dlItems[0].url!=='#pdf')) && (
                <div className="space-y-2">
                  {dlItems.map((item,i)=>(
                    <div key={i} className="flex items-center gap-3 rounded-xl p-3" style={{background:'var(--bg-input)'}}>
                      <Ic n="file" sz={14} cls="text-emerald-400 shrink-0"/>
                      <div className="flex-1 min-w-0"><p className="text-sm font-medium truncate" style={{color:'var(--text)'}}>{item.name}</p>{item.size&&<p className="text-xs" style={{color:'var(--muted)'}}>{item.size}</p>}</div>
                      <a href={item.url} download={item.name} className="text-xs text-blue-400 hover:text-blue-300 px-3 py-1.5 rounded-lg transition-colors" style={{border:'1px solid rgba(37,99,235,0.3)'}}>↓</a>
                    </div>
                  ))}
                  {dlItems.length>1 && <button onClick={downloadAll} className="w-full py-2.5 rounded-xl font-bold text-sm text-white flex items-center justify-center gap-2" style={{background:'#2563EB'}}><Ic n="download" sz={14}/> Download All as ZIP</button>}
                </div>
              )}
            </div>
            <button onClick={()=>{setState('drop');setFiles([]);setPdfBytes(null);setDlItems([]);setError('');setResultNote('');}}
              className="w-full py-3 rounded-2xl font-semibold text-sm transition-colors"
              style={{background:'var(--bg-input)',border:'1px solid var(--border-s)',color:'var(--text)'}}>
              Process Another File
            </button>
          </div>
        )}
      </div>
      {preview && pdfBytes && <PreviewModal pdfBytes={pdfBytes} onClose={()=>setPreview(false)} onDownload={()=>{download();setPreview(false);}} downloadName={dlName}/>}
      {showUpgrade && (
        <UpgradeModal tool={tool} usageInfo={usageStatus} isAuthenticated={isAuthenticated}
          onClose={()=>setShowUpgrade(false)}
          onSignup={()=>{setShowUpgrade(false);openAuth('signup', `Sign up to get 3 free ${tool.label} uses every day — no credit card required.`);}}
          onLogin={()=>{setShowUpgrade(false);openAuth('login');}}/>
      )}
    </div>
  );
}

══════════════════════════════════════ */
function ToolCard({ tool, onClick }) {
  const col = C[tool.color]||C.blue;
  return (
    <a href={`/${tool.slug}`} onClick={e=>{if(e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();onClick();}} className="card card-hover text-left p-5 w-full group block relative" style={{borderColor:'var(--border)'}}>
      {tool.isNew && <span className="absolute top-3 right-3 text-[10px] font-bold px-1.5 py-0.5 rounded" style={{background:'rgba(6,182,212,0.15)',color:'#22D3EE'}}>NEW</span>}
      <div className="w-11 h-11 rounded-xl flex items-center justify-center mb-4" style={{background:col.bg,border:`1px solid ${col.bd}`}}>
        <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke={col.ic} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className="transition-transform duration-300 group-hover:scale-110">
          {(ICONS[tool.icon]||ICONS.file).split('M').filter(Boolean).map((s,i)=><path key={i} d={'M'+s}/>)}
        </svg>
      </div>
      <h3 className="font-semibold text-sm mb-1 group-hover:text-blue-400 transition-colors" style={{color:'var(--text)'}}>{tool.label}</h3>
      <p className="text-xs leading-relaxed line-clamp-2" style={{color:'var(--muted)'}}>{tool.desc}</p>
      <div className="flex items-center justify-between mt-4">
        <span className="text-xs px-2 py-0.5 rounded-full" style={{background:col.badge,color:col.ic}}>{tool.cat}</span>
        {tool.engine==='client'
          ? <span title="Runs on your device. Never uploaded." className="text-emerald-400"><Ic n="lock" sz={13}/></span>
          : <Ic n="arrow" sz={13} cls="text-slate-600 group-hover:text-blue-400 transition-colors"/>}
      </div>
    </a>
  );
}

          </div>

            PDF tools that<br/><span className="gradient-text">never upload your files</span>

              <svg width={15} height={15} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </div>

      {/* Grid */}
      <section id="tools" className="px-4 pb-24 max-w-7xl mx-auto scroll-mt-20">

          {filtered.map(t=><ToolCard key={t.id} tool={t} onClick={()=>onTool(t)}/>)}

/* ══════════════════════════════════════
   NAVBAR
══════════════════════════════════════ */
function Navbar({ onHome, onCategory, onPrivacy }) {
  const { isDark, toggle } = useTheme();
  const { user, logout, openAuth, isAuthenticated } = useAuth();
  const [menuOpen, setMenuOpen] = useState(false);
  const menuRef = useRef(null);

  useEffect(() => {
    if (!menuOpen) return;
    const close = e => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [menuOpen]);

  return (
    <nav className="fixed top-0 inset-x-0 z-40 nav-blur" style={{background:'var(--bg-nav)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--border)'}}>
      <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
        <button onClick={onHome} className="flex items-center gap-2.5 min-w-0 shrink">
          <div className="w-8 h-8 shrink-0 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white text-sm">L</div>
          <span className="font-bold text-sm truncate hidden min-[400px]:inline" style={{color:'var(--text)'}}>LetsConvertPDF</span>
        </button>

        <div className="hidden md:flex items-center gap-1">
          {CATEGORIES.slice(1).map(c=>(
            <button key={c} onClick={() => onCategory(c)} className="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors hover:text-blue-400" style={{color:'var(--muted)'}}>{c}</button>
          ))}
          <a href="/privacy" onClick={e=>{e.preventDefault();onPrivacy();}} className="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors hover:text-blue-400 flex items-center gap-1" style={{color:'#34D399'}}><Ic n="lock" sz={12}/>Privacy</a>
        </div>

        <div className="flex items-center gap-2 shrink-0">
          {/* Theme toggle */}
          <button onClick={toggle}
            className="w-9 h-9 rounded-xl flex items-center justify-center transition-all hover:scale-105"
            style={{background:'var(--bg-input)',border:'1px solid var(--border-s)',color:'var(--muted)'}}
            title={isDark ? 'Switch to light mode' : 'Switch to dark mode'} aria-label={isDark ? 'Switch to light mode' : 'Switch to dark mode'}>
            <Ic n={isDark ? 'sun' : 'moon'} sz={16}/>
          </button>

          {/* Auth area */}
          {isAuthenticated ? (
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(o=>!o)} aria-haspopup="menu" aria-expanded={menuOpen}
                className="flex items-center gap-2 px-3 py-1.5 rounded-xl text-sm font-medium transition-colors"
                style={{background:'var(--bg-input)',border:'1px solid var(--border-s)',color:'var(--text)'}}>
                <div className="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold">
                  {user?.name?.[0]?.toUpperCase()||'U'}
                </div>
                <span className="hidden sm:block max-w-24 truncate">{user?.name}</span>
              </button>
              {menuOpen && (
                <div className="absolute right-0 top-full mt-2 w-56 card-solid anim-up overflow-hidden" style={{zIndex:50}}>
                  <div className="p-3 border-b" style={{borderColor:'var(--border)'}}>
                    <p className="text-xs font-semibold truncate" style={{color:'var(--text)'}}>{user?.name}</p>
                    <p className="text-xs truncate" style={{color:'var(--muted)'}}>{user?.email}</p>
                  </div>
                  <button onClick={()=>{logout();setMenuOpen(false);}}
                    className="w-full flex items-center gap-2 px-3 py-2.5 text-sm hover:bg-red-500/10 text-red-400 transition-colors">
                    <Ic n="logOut" sz={14}/> Sign Out
                  </button>
                </div>
              )}
            </div>
          ) : (
            <div className="flex items-center gap-2">
              <button onClick={() => openAuth('login')} className="px-2 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-colors whitespace-nowrap" style={{color:'var(--muted)'}}>Log In</button>
              <button onClick={() => openAuth('signup')} className="px-3 sm:px-4 py-2 rounded-lg text-xs font-bold text-white whitespace-nowrap" style={{background:'#2563EB'}}>Sign Up</button>
            </div>
          )}
        </div>
      </div>
    </nav>
  );
}

/* ══════════════════════════════════════
   FOOTER

function Footer({ onTool, onPrivacy }) {
  return (

/* ══════════════════════════════════════
   APP ROOT
══════════════════════════════════════ */
function routeFromPath(path) {
  const slug = (path || '/').replace(/^\/+|\/+$/g, '');
  if (slug === 'privacy') return { view:'privacy' };
  const tool = TOOLS.find(t => t.slug === slug);
  return tool ? { view:'tool', tool } : { view:'home' };
}
const TITLE_HOME = 'LetsConvertPDF — Private PDF Tools That Never Upload Your Files';

function App() {
  const [route, setRoute] = useState(() => routeFromPath(location.pathname));
  const [cat, setCat] = useState('All');
  const go = (r, path) => {
    setRoute(r);
    if (location.pathname !== path) history.pushState(null, '', path);
    window.scrollTo(0, 0);
  };
  useEffect(() => {
    const onPop = () => setRoute(routeFromPath(location.pathname));
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  useEffect(() => {
    document.title = route.view === 'tool' ? `${route.tool.label} — Free & Private | LetsConvertPDF`
      : route.view === 'privacy' ? 'Private by design | LetsConvertPDF' : TITLE_HOME;
  }, [route]);
  const openTool = t => go({ view:'tool', tool:t }, `/${t.slug}`);
  const openPrivacy = () => go({ view:'privacy' }, '/privacy');
  const goHome = () => go({ view:'home' }, '/');
  const showCategory = c => {
    go({ view:'home' }, '/'); setCat(c);
    setTimeout(() => document.getElementById('tools')?.scrollIntoView({ behavior: 'smooth' }), 0);
  };
  return (
    <ThemeProvider>
      <AuthProvider>
        <div className="min-h-screen flex flex-col" style={{background:'var(--bg)'}}>
          <Navbar onHome={goHome} onCategory={showCategory} onPrivacy={openPrivacy}/>
          <main className="flex-1">
            {route.view === 'tool'
              ? <Workspace key={route.tool.id} tool={route.tool} onBack={goHome}/>
              : route.view === 'privacy'
                ? <PrivacyPage onTool={openTool}/>
                : <HomePage onTool={openTool} cat={cat} setCat={setCat} onPrivacy={openPrivacy}/>
            }
          </main>
          <Footer onTool={openTool} onPrivacy={openPrivacy}/>
          <ChatWidget/>
        </div>
      </AuthProvider>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

  // Installable app + offline support for the on-device tools.
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
