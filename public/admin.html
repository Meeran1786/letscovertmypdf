<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin · LetsConvertPDF</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563EB'/><text x='4' y='24' font-family='Arial' font-size='20' font-weight='bold' fill='white'>L</text></svg>" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { --bg:#F5F7FB; --card:#FFFFFF; --input:#FFFFFF; --border:#D7DCE5; --text:#111827; --muted:#5B6474; --blue:#2563EB; --red:#DC2626; --green:#059669; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
    a { color:#60A5FA; }
    header { background:#fff; display:flex; align-items:center; gap:12px; padding:14px 24px; border-bottom:1px solid var(--border); }
    header .logo { width:30px; height:30px; border-radius:8px; background:var(--blue); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }
    header .who { margin-left:auto; color:var(--muted); font-size:13px; }
    main { max-width:1100px; margin:0 auto; padding:24px; }
    nav.tabs { display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
    nav.tabs button { background:transparent; border:1px solid var(--border); color:var(--muted); padding:8px 14px; border-radius:10px; cursor:pointer; font:inherit; }
    nav.tabs button[aria-selected="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
    nav.tabs button { background:#fff; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
    h1 { font-size:18px; margin:0; } h2 { font-size:16px; margin:0 0 12px; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
    input[type=text], input[type=url], input[type=date], input[type=number], select { width:100%; background:var(--input); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font:inherit; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    button.btn { background:var(--input); border:1px solid var(--border); color:var(--text); padding:7px 12px; border-radius:8px; cursor:pointer; font:inherit; }
    button.btn:hover { border-color:#60A5FA; }
    button.primary { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
    button.danger { color:var(--red); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .muted { color:var(--muted); } .small { font-size:12px; }
    .msg { padding:10px 12px; border-radius:10px; margin-bottom:12px; }
    .msg.err { background:rgba(239,68,68,.12); color:var(--red); border:1px solid rgba(239,68,68,.3); }
    .msg.ok { background:rgba(16,185,129,.12); color:var(--green); border:1px solid rgba(16,185,129,.3); }
    .preview { border-radius:12px; padding:16px 20px; color:#fff; display:flex; gap:16px; align-items:center; min-height:90px; margin-top:12px; }
    .preview img { height:64px; border-radius:8px; }
    .preview .cta { background:#fff; color:#0f172a; padding:6px 12px; border-radius:10px; font-weight:600; font-size:13px; margin-left:auto; white-space:nowrap; }
    .badge { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,.2); margin-bottom:4px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); font-size:13px; }
    th { color:var(--muted); font-weight:500; }
    .stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; min-width:140px; }
    .stat b { display:block; font-size:22px; }
    .slide-head { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .slide-head strong { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .center { text-align:center; padding:60px 20px; }
    .hidden { display:none !important; }
    .sticky { position:sticky; bottom:0; background:var(--bg); padding:12px 0; border-top:1px solid var(--border); }
    .msg.err { background:#FEF2F2; border-color:#FECACA; }
    .msg.ok { background:#ECFDF5; border-color:#A7F3D0; }
    .stat, .card { box-shadow: 0 1px 2px rgba(16,24,40,.05); }
    input[type=text], input[type=url], input[type=date], input[type=number], select { padding:12px 14px; border-radius:10px; font-size:15px; }
    input:focus, select:focus { outline:2px solid #93C5FD; border-color:#60A5FA; }
    .form { max-width:760px; padding:28px; }
    .form h2 { font-size:24px; }
    .field { margin-top:18px; }
    .field > label { font-size:14px; font-weight:600; color:var(--text); margin-bottom:6px; }
    .hint { font-size:13px; color:var(--muted); margin:6px 0 0; line-height:1.5; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:640px) { .two { grid-template-columns:1fr; } }
    .nowrap { flex-wrap:nowrap; } .nowrap input { flex:1; }
    button.big { width:100%; margin-top:24px; padding:14px; font-size:16px; border:0; border-radius:12px; background:linear-gradient(90deg,#C2453F,#962C84); }
    .check { display:flex; gap:6px; align-items:center; margin:0; color:var(--text); font-size:14px; }
    .banner-preview { margin-top:12px; border:1px dashed var(--border); border-radius:12px; overflow:hidden; background:#F9FAFB; }
    .banner-preview img { display:block; width:100%; aspect-ratio:4/1; object-fit:cover; }
    .thumb { width:120px; height:30px; object-fit:cover; border-radius:6px; display:block; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#EEF2F7; }
    .pill.active { background:#DCFCE7; color:#166534; } .pill.paused { background:#FEF3C7; color:#92400E; } .pill.draft { background:#E0E7FF; color:#3730A3; }
    .warn { color:#B45309; }
    a { color:#2563EB; }
  </style>
</head>
<body>
  <header>
    <div class="logo">L</div>
    <h1>LetsConvertPDF admin</h1>
    <span class="who" id="who"></span>
  </header>
  <main id="app">
    <div class="center muted">Loading…</div>
  </main>
  <script src="/js/admin.js"></script>
</body>
</html>
